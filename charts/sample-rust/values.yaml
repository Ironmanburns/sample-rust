replicaCount: 1
image:
  repository: localhost:5001/sample-rust
  tag: "0.1.0"
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 8080
  nodePort: 30104
ingress:
  enabled: true
  className: nginx
  host: rust-sample.burnsy.me
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 256Mi
